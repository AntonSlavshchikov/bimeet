  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #bimeet-redesign {
    --ink: #121214;
    --ink-2: #5e5a55;
    --ink-3: #9a948d;
    --paper: #faf8f2;
    --surface: #ffffff;
    --surface-2: #f3f0e9;
    --line: rgba(18, 18, 20, .09);
    --line-strong: rgba(18, 18, 20, .15);
    --brand-a: #fb7185;
    --brand-b: #a78bfa;
    --brand-c: #38bdf8;
    --success: #299764;
    --warning: #d97706;
    --danger: #dc5a62;
    --purple: #7857c8;
    --app-radius: 30px;
    --panel-radius: 18px;
    --control-radius: 12px;
    --shadow: 0 24px 70px rgba(36, 30, 20, .11);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    font-size: 15px;
    width: 100%;
    min-width: 0;
    overflow: hidden;
  }

  #bimeet-redesign * { box-sizing: border-box; }
  #bimeet-redesign button,
  #bimeet-redesign input { font: inherit; }
  #bimeet-redesign button { cursor: pointer; }
  #bimeet-redesign svg { display: block; }

  #bimeet-redesign[data-concept=&quot;liquid&quot;] {
    --ink: #17131b;
    --ink-2: #655f6b;
    --ink-3: #938c9a;
    --paper: #f9f7fb;
    --surface: rgba(255, 255, 255, .78);
    --surface-2: rgba(255, 255, 255, .48);
    --line: rgba(73, 52, 84, .11);
    --line-strong: rgba(73, 52, 84, .18);
    --brand-a: #f36d8d;
    --brand-b: #9867e8;
    --brand-c: #34b9e7;
    --app-radius: 34px;
    --panel-radius: 22px;
    --control-radius: 14px;
    --shadow: 0 32px 90px rgba(91, 62, 110, .20);
  }

  #bimeet-redesign[data-concept=&quot;pocket&quot;] {
    --ink: #201a18;
    --ink-2: #665c56;
    --ink-3: #988d85;
    --paper: #fff8ef;
    --surface: #fffdf9;
    --surface-2: #f6eee5;
    --line: rgba(66, 40, 23, .09);
    --line-strong: rgba(66, 40, 23, .16);
    --brand-a: #ff7a7a;
    --brand-b: #a779ef;
    --brand-c: #45bfe7;
    --app-radius: 36px;
    --panel-radius: 24px;
    --control-radius: 15px;
    --shadow: 0 28px 74px rgba(95, 60, 34, .14);
  }

  .br-page {
    position: relative;
    isolation: isolate;
    padding: 38px 30px 56px;
    background:
      radial-gradient(circle at 7% 18%, color-mix(in srgb, var(--brand-a) 18%, transparent) 0, transparent 26%),
      radial-gradient(circle at 94% 13%, color-mix(in srgb, var(--brand-c) 17%, transparent) 0, transparent 25%),
      var(--paper);
  }

  .br-orb {
    position: absolute;
    z-index: -1;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(28px);
    opacity: .32;
    pointer-events: none;
  }
  .br-orb-a { left: -190px; top: 500px; background: var(--brand-b); }
  .br-orb-b { right: -190px; top: 820px; background: var(--brand-c); }

  .br-wrap { width: min(1320px, 100%); margin: 0 auto; }

  .br-intro {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 28px;
    align-items: end;
    margin-bottom: 26px;
  }
  .br-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .br-eyebrow-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b), var(--brand-c));
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand-b) 13%, transparent);
  }
  .br-intro h1 {
    max-width: 780px;
    margin: 0;
    font-size: clamp(34px, 5vw, 62px);
    line-height: 1.01;
    letter-spacing: -.045em;
    font-weight: 780;
  }
  .br-intro p {
    max-width: 690px;
    margin: 16px 0 0;
    color: var(--ink-2);
    font-size: 16px;
    line-height: 1.65;
  }
  .br-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--ink);
    font-weight: 750;
    letter-spacing: -.02em;
  }

  .br-control-deck {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    box-shadow: 0 14px 34px rgba(33, 28, 20, .06);
    backdrop-filter: blur(18px);
  }
  .br-concept-tabs,
  .br-view-tabs { display: flex; gap: 6px; min-width: 0; }
  .br-tab {
    min-width: 0;
    border: 0;
    border-radius: 11px;
    padding: 10px 14px;
    background: transparent;
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 650;
    transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .br-tab:hover { background: var(--surface-2); color: var(--ink); }
  .br-tab:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--brand-b) 40%, transparent);
    outline-offset: 2px;
  }
  .br-tab[aria-pressed=&quot;true&quot;] {
    color: #fff;
    background: linear-gradient(115deg, var(--brand-a), var(--brand-b), var(--brand-c));
    box-shadow: 0 8px 18px color-mix(in srgb, var(--brand-b) 27%, transparent);
  }
  .br-view-tabs {
    padding-left: 8px;
    border-left: 1px solid var(--line);
  }
  .br-view-tabs .br-tab[aria-pressed=&quot;true&quot;] {
    color: var(--ink);
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .br-summary {
    display: grid;
    grid-template-columns: minmax(260px, .74fr) minmax(0, 1.4fr);
    gap: 24px;
    align-items: start;
    padding: 28px 2px 24px;
  }
  .br-summary h2 {
    margin: 0 0 8px;
    font-size: 25px;
    line-height: 1.15;
    letter-spacing: -.025em;
  }
  .br-summary p {
    max-width: 500px;
    margin: 0;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .br-recommend {
    display: inline-flex;
    align-items: center;
    margin-bottom: 10px;
    padding: 5px 9px;
    border-radius: 999px;
    color: var(--success);
    background: color-mix(in srgb, var(--success) 10%, transparent);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .br-recommend[hidden] { display: none; }
  .br-specs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  .br-spec {
    min-width: 0;
    padding: 13px 14px;
    border-left: 1px solid var(--line-strong);
  }
  .br-spec-label {
    display: block;
    margin-bottom: 5px;
    color: var(--ink-3);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .br-spec-value {
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.4;
    font-weight: 620;
  }
  .br-swatches { display: flex; gap: 5px; margin-top: 2px; }
  .br-swatch {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.08);
  }
  .br-swatch:nth-child(1) { background: var(--paper); }
  .br-swatch:nth-child(2) { background: var(--ink); }
  .br-swatch:nth-child(3) { background: var(--brand-a); }
  .br-swatch:nth-child(4) { background: var(--brand-b); }
  .br-swatch:nth-child(5) { background: var(--brand-c); }

  .br-stage {
    position: relative;
    min-width: 0;
    padding: 18px;
    border-radius: 34px;
    background:
      radial-gradient(circle at 8% 12%, color-mix(in srgb, var(--brand-a) 24%, transparent), transparent 26%),
      radial-gradient(circle at 92% 10%, color-mix(in srgb, var(--brand-c) 22%, transparent), transparent 28%),
      linear-gradient(135deg, color-mix(in srgb, var(--brand-b) 9%, var(--paper)), var(--paper));
  }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .br-stage {
    background:
      radial-gradient(circle at 0 15%, rgba(251, 113, 133, .56), transparent 38%),
      radial-gradient(circle at 100% 4%, rgba(56, 189, 248, .52), transparent 36%),
      radial-gradient(circle at 52% 105%, rgba(167, 139, 250, .58), transparent 43%),
      #f6eef9;
  }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .br-stage {
    background:
      radial-gradient(circle at 12% 3%, rgba(255, 194, 122, .42), transparent 29%),
      radial-gradient(circle at 95% 88%, rgba(107, 207, 213, .30), transparent 31%),
      #f8eadb;
  }

  .app-shell {
    position: relative;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 276px;
    min-height: 710px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--app-radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: border-radius .2s ease, background .2s ease;
  }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .app-shell {
    background: rgba(255, 255, 255, .50);
    backdrop-filter: blur(28px) saturate(1.15);
  }

  .app-sidebar {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 22px 14px 15px;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 90%, var(--paper));
  }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .app-sidebar {
    background: rgba(255, 255, 255, .28);
    backdrop-filter: blur(24px);
  }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .app-sidebar { background: #fff7ed; }

  .app-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 20px;
    font-size: 15px;
    font-weight: 760;
    letter-spacing: -.02em;
  }
  .app-brand .br-logo { width: 40px; }
  .app-nav-title {
    margin: 11px 9px 6px;
    color: var(--ink-3);
    font-size: 9px;
    font-weight: 760;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .app-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    margin: 1px 0;
    padding: 9px 10px;
    border-radius: 10px;
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 600;
  }
  .app-nav-item svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .app-nav-item.active {
    color: var(--ink);
    background: var(--surface-2);
  }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .app-nav-item.active {
    background: rgba(255,255,255,.68);
    box-shadow: 0 8px 24px rgba(91, 62, 110, .08);
  }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .app-nav-item.active {
    color: #6a3f24;
    background: #ffe3c7;
  }
  .app-nav-count {
    margin-left: auto;
    padding: 2px 6px;
    border-radius: 999px;
    color: var(--ink-3);
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    font-size: 10px;
  }
  .app-user {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: auto;
    padding: 10px;
    border-radius: 13px;
    background: var(--surface-2);
  }
  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border: 2px solid var(--surface);
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    font-size: 10px;
    font-weight: 750;
  }
  .avatar.a2 { background: linear-gradient(135deg, #35b7d6, #4f7bdc); }
  .avatar.a3 { background: linear-gradient(135deg, #f4a15d, #df6477); }
  .avatar.a4 { background: linear-gradient(135deg, #66b789, #3b8f85); }
  .avatar.a5 { background: linear-gradient(135deg, #9e7be7, #db76a7); }
  .app-user-copy { min-width: 0; }
  .app-user-name { overflow: hidden; color: var(--ink); font-size: 11.5px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .app-user-mail { overflow: hidden; margin-top: 2px; color: var(--ink-3); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }

  .app-main { min-width: 0; padding: 25px 26px 36px; background: color-mix(in srgb, var(--surface) 94%, transparent); }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .app-main { background: rgba(255,255,255,.38); }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .app-main { background: #fffaf4; }
  .app-toolbar { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .search-field {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    height: 36px;
    flex: 1;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: var(--control-radius);
    color: var(--ink-3);
    background: var(--surface-2);
    font-size: 11.5px;
  }
  .search-field svg { width: 15px; height: 15px; }
  .search-kbd {
    margin-left: auto;
    padding: 2px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--ink-3);
    background: var(--surface);
    font-size: 9px;
  }
  .icon-action,
  .primary-action,
  .soft-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
    border: 0;
    border-radius: var(--control-radius);
    font-size: 11.5px;
    font-weight: 700;
  }
  .icon-action { width: 36px; color: var(--ink-2); background: var(--surface-2); }
  .icon-action svg,
  .primary-action svg,
  .soft-action svg { width: 15px; height: 15px; }
  .primary-action {
    padding: 0 14px;
    color: #fff;
    background: linear-gradient(115deg, var(--brand-a), var(--brand-b), var(--brand-c));
    box-shadow: 0 9px 20px color-mix(in srgb, var(--brand-b) 24%, transparent);
  }
  .soft-action { padding: 0 14px; color: var(--ink); background: var(--surface-2); }

  .page-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin: 28px 0 20px;
  }
  .page-title { margin: 0; font-size: 28px; line-height: 1.05; letter-spacing: -.035em; }
  .page-sub { margin-top: 7px; color: var(--ink-3); font-size: 11.5px; }
  .segmented {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px;
    border-radius: 11px;
    background: var(--surface-2);
  }
  .segment {
    padding: 6px 9px;
    border-radius: 8px;
    color: var(--ink-3);
    font-size: 10px;
    font-weight: 650;
    white-space: nowrap;
  }
  .segment.active { color: var(--ink); background: var(--surface); box-shadow: 0 1px 4px rgba(20,20,20,.06); }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .segment.active { background: rgba(255,255,255,.8); }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .segment.active { color: #754024; background: #ffe3c7; }

  .event-section + .event-section { margin-top: 22px; }
  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 3px 8px;
    color: var(--ink-3);
    font-size: 9.5px;
    font-weight: 760;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .event-list {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--panel-radius);
    background: var(--surface);
  }
  .event-row {
    --event-tint: var(--surface);
    position: relative;
    display: grid;
    grid-template-columns: 47px minmax(150px, 1fr) 92px 64px 48px 72px 12px;
    gap: 12px;
    align-items: center;
    min-width: 0;
    padding: 12px 14px 12px 17px;
    background: var(--event-tint);
  }
  .event-row + .event-row { border-top: 1px solid var(--line); }
  .event-row::before {
    content: &quot;&quot;;
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--row-color, var(--brand-b));
  }
  .date-cell { text-align: center; }
  .date-day { font-size: 20px; line-height: 1; font-weight: 760; letter-spacing: -.03em; }
  .date-caption { margin-top: 4px; color: var(--ink-3); font-size: 8px; font-weight: 720; letter-spacing: .08em; text-transform: uppercase; }
  .event-info { min-width: 0; }
  .event-name { overflow: hidden; font-size: 12.5px; font-weight: 720; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
  .event-place { overflow: hidden; margin-top: 4px; color: var(--ink-3); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .event-time { color: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .avatar-stack { display: flex; align-items: center; }
  .avatar-stack .avatar { width: 24px; height: 24px; margin-left: -7px; font-size: 8px; }
  .avatar-stack .avatar:first-child { margin-left: 0; }
  .event-count { color: var(--ink-3); font-size: 9.5px; white-space: nowrap; }
  .event-status {
    justify-self: end;
    padding: 5px 8px;
    border-radius: 999px;
    color: var(--status-color, var(--success));
    background: color-mix(in srgb, var(--status-color, var(--success)) 10%, transparent);
    font-size: 9px;
    font-weight: 720;
    white-space: nowrap;
  }
  .event-chevron { color: var(--ink-3); }
  .event-chevron svg { width: 12px; height: 12px; }

  #bimeet-redesign[data-concept=&quot;liquid&quot;] .event-list {
    background: rgba(255,255,255,.76);
    box-shadow: 0 15px 36px rgba(73, 52, 84, .07);
    backdrop-filter: blur(18px);
  }
  #bimeet-redesign[data-concept=&quot;liquid&quot;] .event-row { --event-tint: rgba(255,255,255,.56); }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .event-list {
    display: grid;
    gap: 8px;
    overflow: visible;
    border: 0;
    border-radius: 0;
    background: transparent;
  }
  #bimeet-redesign[data-concept=&quot;pocket&quot;] .event-row {

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;bimeet-redesign&#x27;);
    if (!root) return;

    const concepts = {
      warm: {
        title: &#x27;Warm Canvas&#x27;,
        copy: &#x27;Спокойная продуктовая база: кремовый холст, цельные белые поверхности и фирменный градиент только там, где он помогает действию.&#x27;,
        surfaces: &#x27;Плотные, без blur&#x27;,
        radius: &#x27;12–30 px, сдержанно&#x27;,
        gradient: &#x27;CTA и active state&#x27;,
        recommended: true,
      },
      liquid: {
        title: &#x27;Liquid Workspace&#x27;,
        copy: &#x27;Эмоциональный премиум-вариант: цвет живёт под полупрозрачной оболочкой, а рабочие списки остаются спокойными и хорошо читаемыми.&#x27;,
        surfaces: &#x27;Glass shell, плотные списки&#x27;,
        radius: &#x27;14–34 px, мягко&#x27;,
        gradient: &#x27;Фон, CTA и акценты&#x27;,
        recommended: false,
      },
      pocket: {
        title: &#x27;Pocket Moments&#x27;,
        copy: &#x27;Самый дружелюбный mobile-first язык: самостоятельные пастельные карточки событий, крупные даты и короткие живые уведомления.&#x27;,
        surfaces: &#x27;Тёплые цветные карточки&#x27;,
        radius: &#x27;15–36 px, выразительно&#x27;,
        gradient: &#x27;CTA и notification chips&#x27;,
        recommended: false,
      },
    };

    const title = root.querySelector(&#x27;#br-concept-title&#x27;);
    const copy = root.querySelector(&#x27;#br-concept-copy&#x27;);
    const surfaces = root.querySelector(&#x27;#br-surface-spec&#x27;);
    const radius = root.querySelector(&#x27;#br-radius-spec&#x27;);
    const gradient = root.querySelector(&#x27;#br-gradient-spec&#x27;);
    const recommend = root.querySelector(&#x27;#br-recommend&#x27;);

    root.querySelectorAll(&#x27;[data-concept-button]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const concept = button.getAttribute(&#x27;data-concept-button&#x27;);
        const data = concepts[concept];
        if (!data) return;
        root.dataset.concept = concept;
        root.querySelectorAll(&#x27;[data-concept-button]&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        title.textContent = data.title;
        copy.textContent = data.copy;
        surfaces.textContent = data.surfaces;
        radius.textContent = data.radius;
        gradient.textContent = data.gradient;
        recommend.hidden = !data.recommended;
      });
    });

    root.querySelectorAll(&#x27;[data-view-button]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const view = button.getAttribute(&#x27;data-view-button&#x27;);
        if (!view) return;
        root.dataset.view = view;
        root.querySelectorAll(&#x27;[data-view-button]&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
      });
    });

    root.querySelectorAll(&#x27;[data-section-demo]&#x27;).forEach((demo) =&gt; {
      const activeTitle = demo.querySelector(&#x27;[data-active-section]&#x27;);
      const activeCopy = demo.querySelector(&#x27;[data-active-copy]&#x27;);
      demo.querySelectorAll(&#x27;[data-section-name]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          demo.querySelectorAll(&#x27;[data-section-name]&#x27;).forEach((item) =&gt; {
            item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button));
          });
          if (activeTitle) activeTitle.textContent = button.getAttribute(&#x27;data-section-name&#x27;) || &#x27;&#x27;;
          if (activeCopy) activeCopy.textContent = button.getAttribute(&#x27;data-section-copy&#x27;) || &#x27;&#x27;;
        });
      });
    });
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
