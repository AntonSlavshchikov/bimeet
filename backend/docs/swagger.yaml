basePath: /api
definitions:
  model.AdminDistribution:
    properties:
      by_category:
        items:
          $ref: '#/definitions/model.AdminDistributionItem'
        type: array
      by_status:
        items:
          $ref: '#/definitions/model.AdminDistributionItem'
        type: array
      by_visibility:
        items:
          $ref: '#/definitions/model.AdminDistributionItem'
        type: array
    type: object
  model.AdminDistributionItem:
    properties:
      count:
        type: integer
      key:
        type: string
    type: object
  model.AdminEventRow:
    properties:
      category:
        type: string
      created_at:
        type: string
      date_start:
        type: string
      id:
        type: string
      is_public:
        type: boolean
      organizer_email:
        type: string
      organizer_id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  model.AdminOverview:
    properties:
      events_active:
        type: integer
      events_completed:
        type: integer
      total_collected:
        type: number
      total_collections:
        type: integer
      total_events:
        type: integer
      total_users:
        type: integer
      users_active_7d:
        type: integer
      users_active_30d:
        type: integer
    type: object
  model.AdminTimeseries:
    properties:
      points:
        items:
          $ref: '#/definitions/model.AdminTimeseriesPoint'
        type: array
    type: object
  model.AdminTimeseriesPoint:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      events:
        type: integer
      users:
        type: integer
    type: object
  model.AdminUserRow:
    properties:
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
    type: object
  model.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  model.Carpool:
    properties:
      departure_point:
        type: string
      driver_id:
        type: string
      event_id:
        type: string
      id:
        type: string
      seats_available:
        type: integer
    type: object
  model.CarpoolInfo:
    properties:
      departure_point:
        type: string
      driver:
        $ref: '#/definitions/model.UserInfo'
      id:
        type: string
      passengers:
        items:
          $ref: '#/definitions/model.UserInfo'
        type: array
      seats_available:
        type: integer
    type: object
  model.ChangeLogInfo:
    properties:
      changed_at:
        type: string
      changed_by:
        $ref: '#/definitions/model.UserInfo'
      field_name:
        type: string
      id:
        type: string
      new_value:
        type: string
      old_value:
        type: string
    type: object
  model.ChatLastMessage:
    properties:
      author_name:
        type: string
      body:
        type: string
      created_at:
        type: string
      deleted:
        type: boolean
      image_url:
        type: string
      is_mine:
        type: boolean
    type: object
  model.ChatSummary:
    properties:
      event_id:
        type: string
      event_title:
        type: string
      is_permanent:
        type: boolean
      last_activity_at:
        type: string
      last_message:
        $ref: '#/definitions/model.ChatLastMessage'
      unread_count:
        type: integer
    type: object
  model.Collection:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      event_id:
        type: string
      id:
        type: string
      per_person_amount:
        type: number
      title:
        type: string
    type: object
  model.CollectionContribution:
    properties:
      collection_id:
        type: string
      id:
        type: string
      paid:
        type: boolean
      paid_at:
        type: string
      receipt_url:
        type: string
      status:
        description: not_paid | pending | paid
        type: string
      user_id:
        type: string
    type: object
  model.CollectionInfo:
    properties:
      contributions:
        items:
          $ref: '#/definitions/model.ContributionInfo'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      per_person_amount:
        type: number
      title:
        type: string
    type: object
  model.CollectionSummary:
    properties:
      collection_id:
        type: string
      expected_total:
        type: number
      paid_count:
        type: integer
      per_person_amount:
        type: number
      remaining:
        type: number
      title:
        type: string
      total_count:
        type: integer
      total_paid:
        type: number
    type: object
  model.ContributionInfo:
    properties:
      id:
        description: nil when the member has no contribution row yet
        type: string
      paid:
        type: boolean
      paid_at:
        type: string
      receipt_url:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/model.UserInfo'
    type: object
  model.CreateCarpoolRequest:
    properties:
      departure_point:
        type: string
      seats_available:
        type: integer
    type: object
  model.CreateCollectionRequest:
    properties:
      per_person_amount:
        type: number
      title:
        type: string
    type: object
  model.CreateEventRequest:
    properties:
      category:
        description: ordinary | business; defaults to ordinary
        type: string
      date_end:
        type: string
      date_start:
        type: string
      description:
        type: string
      dress_code:
        type: string
      is_public:
        type: boolean
      location:
        type: string
      location_lat:
        type: number
      location_lng:
        type: number
      max_guests:
        type: integer
      title:
        type: string
    type: object
  model.CreateItemRequest:
    properties:
      name:
        type: string
    type: object
  model.CreatePollRequest:
    properties:
      options:
        items:
          type: string
        type: array
      question:
        type: string
    type: object
  model.Event:
    properties:
      category:
        description: ordinary | business
        type: string
      created_at:
        type: string
      date_end:
        type: string
      date_start:
        description: nil = permanent event (no schedule)
        type: string
      description:
        type: string
      dress_code:
        type: string
      id:
        type: string
      invite_token:
        type: string
      is_public:
        type: boolean
      last_activity_at:
        type: string
      location:
        type: string
      location_lat:
        type: number
      location_lng:
        type: number
      max_guests:
        type: integer
      organizer_id:
        type: string
      status:
        description: active | completed
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.EventCollectionsSummaryResponse:
    properties:
      collections:
        items:
          $ref: '#/definitions/model.CollectionSummary'
        type: array
      grand_total:
        type: number
      remaining:
        type: number
      total_paid:
        type: number
    type: object
  model.EventDetail:
    properties:
      carpools:
        items:
          $ref: '#/definitions/model.CarpoolInfo'
        type: array
      category:
        type: string
      change_log:
        items:
          $ref: '#/definitions/model.ChangeLogInfo'
        type: array
      collections:
        items:
          $ref: '#/definitions/model.CollectionInfo'
        type: array
      confirmed_count:
        type: integer
      created_at:
        type: string
      date_end:
        type: string
      date_start:
        type: string
      description:
        type: string
      dress_code:
        type: string
      id:
        type: string
      invite_token:
        type: string
      is_public:
        type: boolean
      items:
        items:
          $ref: '#/definitions/model.ItemInfo'
        type: array
      last_activity_at:
        type: string
      location:
        type: string
      location_lat:
        type: number
      location_lng:
        type: number
      max_guests:
        type: integer
      organizer:
        $ref: '#/definitions/model.UserInfo'
      participants:
        items:
          $ref: '#/definitions/model.ParticipantInfo'
        type: array
      polls:
        items:
          $ref: '#/definitions/model.PollInfo'
        type: array
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.EventListItem:
    properties:
      category:
        type: string
      confirmed_count:
        type: integer
      created_at:
        type: string
      date_end:
        type: string
      date_start:
        type: string
      description:
        type: string
      dress_code:
        type: string
      id:
        type: string
      invite_token:
        type: string
      is_public:
        type: boolean
      last_activity_at:
        type: string
      location:
        type: string
      max_guests:
        type: integer
      my_status:
        type: string
      organizer:
        $ref: '#/definitions/model.UserInfo'
      participants:
        items:
          $ref: '#/definitions/model.ParticipantInfo'
        type: array
      status:
        type: string
      title:
        type: string
    type: object
  model.EventParticipant:
    properties:
      event_id:
        type: string
      id:
        type: string
      status:
        description: invited | confirmed | declined
        type: string
      user_id:
        type: string
    type: object
  model.InviteEventInfo:
    properties:
      category:
        type: string
      confirmed_count:
        type: integer
      date_end:
        type: string
      date_start:
        type: string
      description:
        type: string
      dress_code:
        type: string
      id:
        type: string
      is_public:
        type: boolean
      location:
        type: string
      organizer:
        $ref: '#/definitions/model.PublicUserInfo'
      title:
        type: string
    type: object
  model.InviteParticipantRequest:
    properties:
      email:
        type: string
    type: object
  model.Item:
    properties:
      assigned_to:
        type: string
      event_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.ItemInfo:
    properties:
      assigned_to:
        $ref: '#/definitions/model.UserInfo'
      id:
        type: string
      name:
        type: string
    type: object
  model.JoinByInviteTokenRequest:
    properties:
      action:
        description: '"join" | "decline"; defaults to "join"'
        type: string
    type: object
  model.Message:
    properties:
      author:
        $ref: '#/definitions/model.UserInfo'
      body:
        type: string
      created_at:
        type: string
      deleted:
        type: boolean
      event_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_mine:
        type: boolean
      reactions:
        items:
          $ref: '#/definitions/model.ReactionSummary'
        type: array
      reply_to:
        $ref: '#/definitions/model.ReplyPreview'
    type: object
  model.Notification:
    properties:
      count:
        description: collapsed events of the same kind (e.g. chat messages)
        type: integer
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  model.OrganizerStat:
    properties:
      email:
        type: string
      event_count:
        type: integer
      name:
        type: string
      user_id:
        type: string
    type: object
  model.ParticipantInfo:
    properties:
      is_organizer:
        type: boolean
      status:
        type: string
      user:
        $ref: '#/definitions/model.UserInfo'
    type: object
  model.Poll:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      event_id:
        type: string
      id:
        type: string
      options:
        items:
          $ref: '#/definitions/model.PollOption'
        type: array
      question:
        type: string
    type: object
  model.PollInfo:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      options:
        items:
          $ref: '#/definitions/model.PollOptionInfo'
        type: array
      question:
        type: string
    type: object
  model.PollOption:
    properties:
      id:
        type: string
      label:
        type: string
      poll_id:
        type: string
      votes:
        type: integer
    type: object
  model.PollOptionInfo:
    properties:
      id:
        type: string
      label:
        type: string
      vote_count:
        type: integer
      voted:
        description: whether the caller voted for this option
        type: boolean
    type: object
  model.PostMessageRequest:
    properties:
      body:
        type: string
      reply_to_id:
        type: string
    type: object
  model.ProfileStats:
    properties:
      completed:
        type: integer
      organized:
        type: integer
      participated:
        type: integer
      upcoming:
        type: integer
    type: object
  model.PublicEventListItem:
    properties:
      category:
        type: string
      confirmed_count:
        type: integer
      created_at:
        type: string
      date_end:
        type: string
      date_start:
        type: string
      description:
        type: string
      dress_code:
        type: string
      id:
        type: string
      is_participant:
        type: boolean
      is_public:
        type: boolean
      location:
        type: string
      max_guests:
        type: integer
      my_status:
        type: string
      organizer:
        $ref: '#/definitions/model.PublicUserInfo'
      participants:
        items:
          $ref: '#/definitions/model.PublicParticipantInfo'
        type: array
      status:
        type: string
      title:
        type: string
    type: object
  model.PublicParticipantInfo:
    properties:
      is_organizer:
        type: boolean
      status:
        type: string
      user:
        $ref: '#/definitions/model.PublicUserInfo'
    type: object
  model.PublicUserInfo:
    properties:
      is_me:
        type: boolean
      name:
        type: string
    type: object
  model.PushSubscribeRequest:
    properties:
      endpoint:
        type: string
      keys:
        properties:
          auth:
            type: string
          p256dh:
            type: string
        type: object
    type: object
  model.PushUnsubscribeRequest:
    properties:
      endpoint:
        type: string
    type: object
  model.ReactionSummary:
    properties:
      count:
        type: integer
      emoji:
        type: string
      reactors:
        items:
          type: string
        type: array
    type: object
  model.ReplyPreview:
    properties:
      author_name:
        type: string
      body:
        type: string
      deleted:
        type: boolean
      id:
        type: string
    type: object
  model.RequestCodeRequest:
    properties:
      email:
        type: string
    type: object
  model.ScheduleEventRequest:
    properties:
      date_end:
        type: string
      date_start:
        type: string
    type: object
  model.ToggleReactionRequest:
    properties:
      emoji:
        type: string
    type: object
  model.UnreadCountResponse:
    properties:
      count:
        type: integer
    type: object
  model.UpdateEventRequest:
    properties:
      category:
        type: string
      description:
        type: string
      dress_code:
        type: string
      is_public:
        type: boolean
      location:
        type: string
      location_lat:
        type: number
      location_lng:
        type: number
      max_guests:
        type: integer
      title:
        type: string
    type: object
  model.UpdateItemRequest:
    properties:
      assigned:
        description: true = take for self, false = unassign
        type: boolean
    type: object
  model.UpdateParticipantStatusRequest:
    properties:
      status:
        description: confirmed | declined
        type: string
    type: object
  model.UpdateProfileRequest:
    properties:
      birth_date:
        description: '"YYYY-MM-DD", empty = clear'
        type: string
      city:
        type: string
      last_name:
        type: string
      name:
        type: string
    type: object
  model.User:
    properties:
      avatar_url:
        type: string
      birth_date:
        type: string
      city:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
    type: object
  model.UserInfo:
    properties:
      email:
        type: string
      is_me:
        type: boolean
      name:
        type: string
    type: object
  model.VerifyCodeRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  model.VoteRequest:
    properties:
      option_id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  response.StatusResponse:
    properties:
      status:
        type: string
    type: object
  response.VAPIDKeyResponse:
    properties:
      key:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for Bimeet events, invitations, collections, polls, chat,
    profile, push notifications, and admin dashboards.
  title: Bimeet API
  version: "1.0"
paths:
  /admin/distribution:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AdminDistribution'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin event distribution metrics
      tags:
      - admin
  /admin/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AdminOverview'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin overview metrics
      tags:
      - admin
  /admin/recent-events:
    get:
      parameters:
      - description: Maximum number of events, clamped to 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AdminEventRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recently created events
      tags:
      - admin
  /admin/recent-users:
    get:
      parameters:
      - description: Maximum number of users, clamped to 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AdminUserRow'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recently registered users
      tags:
      - admin
  /admin/timeseries:
    get:
      parameters:
      - description: Number of days, clamped to 1..365
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AdminTimeseries'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin user and event timeseries
      tags:
      - admin
  /admin/top-organizers:
    get:
      parameters:
      - description: Maximum number of organizers, clamped to 1..50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OrganizerStat'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get top event organizers
      tags:
      - admin
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - profile
  /auth/me/avatar:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current user avatar
      tags:
      - profile
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar image
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload current user avatar
      tags:
      - profile
  /auth/me/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ProfileStats'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile statistics
      tags:
      - profile
  /auth/request-code:
    post:
      consumes:
