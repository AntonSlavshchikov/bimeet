services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetup
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: meetup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

volumes:
  postgres_data:
