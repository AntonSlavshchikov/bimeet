# Shared json-file log rotation so container stdout (structured slog JSON) does
# not grow unbounded and fill the host disk. Read with `docker compose logs`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.6
    logging: *default-logging
    environment:
      - DOCKER_API_VERSION=1.54
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --certificatesresolvers.le.acme.email=lozzyklingers@gmail.com
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme_data:/acme
    networks:
      - app-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bimeet
      POSTGRES_USER: bimeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bimeet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimeet"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`s3.bimeet.pro`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls.certresolver=le
      - traefik.http.services.minio.loadbalancer.server.port=9000

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-avatars}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${S3_BUCKET} &&
        mc anonymous set public local/$${S3_BUCKET}
      "

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/bimeet-backend:${IMAGE_TAG:-latest}
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/bimeet-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.bimeet.pro`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=80

  landing:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/bimeet-landing:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.landing.rule=Host(`bimeet.pro`) || Host(`www.bimeet.pro`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=le
      - traefik.http.services.landing.loadbalancer.server.port=80

  # ----------------------------------------------------------------------------
  # Observability stack (profile: observability).
  # Start with:  docker compose -f docker-compose.prod.yml --profile observability up -d
  # Traces:  Jaeger UI    — SSH-tunnel :16686
  # Logs:    Grafana/Loki — SSH-tunnel :3000  (ssh -L 3000:localhost:3000 host)
  # Both UIs bind to 127.0.0.1 only, so they are never publicly exposed.
  # To export backend traces, set in .env.prod:
  #   OTEL_ENABLED=true
  #   OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (via SSH tunnel)
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.0
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.0
    profiles: [observability]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # Grafana UI (via SSH tunnel)
    depends_on:
      - loki
    networks:
      - app-net
    restart: unless-stopped
    logging: *default-logging

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  acme_data:
  loki_data:
  grafana_data:
