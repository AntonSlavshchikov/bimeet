server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Не ставим X-Real-IP $remote_addr — здесь $remote_addr это IP Traefik, а не
        # клиента. Бэкенд (chi RealIP) берёт реальный IP из первого элемента
        # X-Forwarded-For, который проставляет Traefik. Иначе rate limiter
        # сгруппирует весь трафик под одним IP прокси и начнёт отдавать 429.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Service worker и manifest не должны кэшироваться надолго,
    # иначе пользователи застрянут на старой версии
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
