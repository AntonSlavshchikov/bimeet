server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Upload endpoints enforce their own per-file limits (avatars: 5 MiB,
        # receipts/chat images: 10 MiB). Nginx defaults to 1 MiB, which used to
        # reject otherwise valid uploads before they reached the backend.
        client_max_body_size 12m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Real client IP: Traefik writes it into X-Forwarded-For, nginx appends
        # Traefik's address, and the backend (middleware.ClientIP) reads the
        # chain right to left. Client-sent IP headers are dropped here as well;
        # the backend ignores them anyway.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP "";
    }

    # Service worker и manifest не должны кэшироваться надолго,
    # иначе пользователи застрянут на старой версии
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
