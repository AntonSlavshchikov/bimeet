# coturn: STUN + TURN for 1:1 calls (see docs/adr/0005-calls-p2p-webrtc.md).
# Secrets and the public IP are NOT here: they come from .env.prod as
# command-line flags in docker-compose.prod.yml (--static-auth-secret,
# --external-ip), so this file can live in git.

# Auth: time-limited credentials minted by the backend
# (GET /api/calls/ice-servers): username = "<unix_expiry>:<userID>",
# password = base64(HMAC-SHA1(secret, username)). No user DB in coturn.
use-auth-secret
realm=bimeet.pro

# Ports. 3478 serves both STUN and TURN (UDP and TCP). Relayed media uses
# the 49160-49200 UDP range — 41 ports ≈ 20 concurrent relayed calls,
# enough for this project. Must match firewall.tf and cloud-init (ufw).
listening-port=3478
min-port=49160
max-port=49200

# No TLS TURN (5349): future work. Media is still encrypted end to end by
# WebRTC itself (DTLS-SRTP); TLS on 5349 only helps clients behind proxies
# that block everything except TLS.
no-tls
no-dtls

# Hardening.
no-cli
no-multicast-peers
fingerprint
# Never relay to private ranges: otherwise anyone with valid TURN creds could
# use our server to reach services on its internal networks (SSRF via TURN),
# e.g. Postgres or MinIO on the Docker bridge.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# Logs to stdout → `docker compose logs coturn`.
log-file=stdout
simple-log
