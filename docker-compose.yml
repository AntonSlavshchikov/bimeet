name: bimeet-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bimeet
      POSTGRES_USER: bimeet
      POSTGRES_PASSWORD: bimeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimeet -d bimeet"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/avatars &&
        mc anonymous set public local/avatars
      "

  backend:
    image: bimeet-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8080"
      DSN: postgres://bimeet:bimeet@postgres:5432/bimeet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      AUTH_TEST: "true"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:5173
      APP_ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: avatars
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/avatars
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_go_mod:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - backend_air:/app/.air
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/swagger/index.html"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    image: bimeet-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      VITE_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  backend_go_mod:
  backend_go_build:
  backend_air:
  frontend_node_modules:
